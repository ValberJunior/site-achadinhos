name: Build and push Docker image

# Builda a imagem do site-achadinhos e publica no DockerHub a cada push
# na main (ou manualmente via "Run workflow"). Precisa dos seguintes
# Secrets configurados em Settings > Secrets and variables > Actions:
#
#   DOCKERHUB_USERNAME               seu usuário do DockerHub
#   DOCKERHUB_TOKEN                  access token do DockerHub (não a senha —
#                                     gerar em hub.docker.com > Account Settings
#                                     > Security > New Access Token)
#   DOCKERHUB_IMAGE                  nome da imagem, ex: valberjr/site-achadinhos
#   NEXT_PUBLIC_WHATSAPP_GROUP_URL   (opcional) link do grupo do WhatsApp;
#                                     inlinado no build do Next — se não
#                                     configurar, usa o fallback do código

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_WHATSAPP_GROUP_URL=${{ secrets.NEXT_PUBLIC_WHATSAPP_GROUP_URL }}
          tags: |
            ${{ secrets.DOCKERHUB_IMAGE }}:latest
            ${{ secrets.DOCKERHUB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
